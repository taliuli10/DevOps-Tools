version: '3.8'

services:
  web:
    build: .
    container_name: app_web_container
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=uvv_user
      - DB_PASSWORD=uvv_password
      - DB_NAME=escola_db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: mysql_db_container
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: escola_db
      MYSQL_USER: uvv_user
      MYSQL_PASSWORD: uvv_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
